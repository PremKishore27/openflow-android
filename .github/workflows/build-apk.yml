name: Build apps
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare the release signing key
        env:
          KS_B64: ${{ secrets.OPENFLOW_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.OPENFLOW_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.OPENFLOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPENFLOW_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/openflow.jks"
            echo "OPENFLOW_KEYSTORE_FILE=$RUNNER_TEMP/openflow.jks" >> "$GITHUB_ENV"
            echo "OPENFLOW_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "OPENFLOW_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "OPENFLOW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the permanent OpenFlow release key."
          else
            echo "::warning::No signing key configured. This build uses a temporary key, so it will not install over other builds."
          fi
      - name: Unit tests
        run: ./gradlew test
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Name the APK and show its signing certificate
        run: |
          cp app/build/outputs/apk/release/app-release.apk OpenFlow-Android.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner" verify --print-certs OpenFlow-Android.apk | grep "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-Android
          path: OpenFlow-Android.apk
      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" OpenFlow-Android.apk \
            --title "OpenFlow $GITHUB_REF_NAME" \
            --generate-notes \
            --latest

  ios:
    # Builds an UNSIGNED .ipa on GitHub's Mac servers. Sideloadly or AltStore signs it with your own Apple ID.
    runs-on: macos-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/OpenFlow.xcodeproj -scheme OpenFlow \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OpenFlow.app Payload/
          zip -qry OpenFlow-iOS-unsigned.ipa Payload
          ls -l OpenFlow-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OpenFlow-iOS-unsigned
          path: OpenFlow-iOS-unsigned.ipa
      - name: Attach to the release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" OpenFlow-iOS-unsigned.ipa --clobber
