name: OpenFlow
options:
  bundleIdPrefix: com.openflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set DEVELOPMENT_TEAM to your Apple Team ID in Xcode (Signing & Capabilities), or on the command line.
targets:
  OpenFlow:
    type: application
    platform: iOS
    sources:
      - path: OpenFlow
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openflow.ios
        CODE_SIGN_ENTITLEMENTS: OpenFlow/OpenFlow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: "8"
    info:
      path: OpenFlow/Info.plist
      properties:
        CFBundleDisplayName: OpenFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.openflow.ios
            CFBundleURLSchemes: [openflow]
        NSMicrophoneUsageDescription: OpenFlow listens while you dictate.
        NSSpeechRecognitionUsageDescription: OpenFlow turns your speech into text on your iPhone.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    dependencies:
      - target: OpenFlowKeyboard
        embed: true
  OpenFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenFlowKeyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openflow.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: OpenFlowKeyboard/OpenFlowKeyboard.entitlements
        MARKETING_VERSION: "0.8"
        CURRENT_PROJECT_VERSION: "8"
    info:
      path: OpenFlowKeyboard/Info.plist
      properties:
        CFBundleDisplayName: OpenFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            IsASCIICapable: false
            PrimaryLanguage: en-US
